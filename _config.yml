        - name: "Tutor Intelligence"
          logo: "/images/logos/Tutor-Intelligence-Logo.webp"
          url: "https://tutorintelligence.com/"
          description: |
            **About Tutor Intelligence:** We believe general-purpose, generally-intelligent robots will be built *in our lifetimes.* Robots will work in our factories, move our goods, walk on our streets and eventually be in our homes. To build that future, research and deployment must work in lockstep: real-world operation must make the technology better and better technology must make deployment easier. We're looking for the thinkers, builders, and researchers who want to be part of that loop.

