  judges:
    - name: "Ali Al-Bustami"
      role: "Robotics Research Lead at Midcentury Labs"
      photo: "/images/judges/Ali-Al-Bustami.webp"
      bio: >-
        Ali Al-Bustami is Robotics Research Lead at Midcentury Labs, where he leads the team's post-training and evaluation work for robot policies. His research sits at the intersection of computer vision, robotics, and foundation models, focused on egocentric perception, vision-language-action (VLA) models, and the benchmarks that make policy performance measurable.
    - name: "Brandon Samaroo"
      role: "Head of Research at Midcentury Labs"
      photo: "/images/judges/Brandon-Samaroo.webp"
      bio: >-
        Brandon Samaroo is the Head of Research at Midcentury Labs, where he leads the company's world model program and a research team spanning robotics and simulation. His work spans world model training on large-scale egocentric manipulation data, neural rendering for sim-to-real transfer, and evaluation methodology for physical world models. His current focus is autoregressive neural rendering with diffusion models, training them to convert a simulator's geometry and material buffers into photorealistic video to better model the real world. His longer-term goal is to close the sim-to-real gap by replacing the hand-built parts of simulation with learned systems: neural renderers in place of rasterization and path tracing, and learned dynamics in place of physics solvers.
    - name: "Josh Elijah"
      role: "CEO at BotBlox"
      email: "josh@botblox.com"
      photo: "/images/judges/Josh-Elijah.png"
      bio: >-
        Josh holds a master's degree in Electronic Engineering from the University of Manchester, five patents, and deep experience in electronics, manufacturing, and FPGA technology. He currently leads BotBlox Inc., a hardware company enabling the wired data backbone of modern autonomous systems.
    - name: "Aniket Dhole"
      role: "Robotics Engineer at Clarapath"
      photo: "/images/judges/Aniket-Dhole.jpg"
      bio: >-
        Aniket is a Robotics Engineer at Clarapath, focusing on controls and software development. Having participated in numerous hackathons during his own studies, he is passionate about hardware-software integration and is thrilled to mentor students through the rapid prototyping process.
    - name: "David Watkins"
      role: "Research Lead at Tutor Intelligence"
      photo: "/images/judges/David-Watkins.jpg"
      bio: >-
        David Watkins is a Research Lead at Tutor Intelligence, where he works on foundation model research and training for robot manipulation, and an advisor to Tola Capital on robotics and AI investments. Previously, he was a Research Lead at the RAI Institute (formerly Boston Dynamics AI Institute), joining as one of its first employees and building its foundation models research team and its largest robot data collection effort. He created Theia, a vision foundation model published at CoRL 2024, and won first place in the MineRL BASALT competition at NeurIPS 2021. He earned his B.S., M.S., and Ph.D. at Columbia University in the Columbia Robotics Lab under Prof. Peter Allen, where his paper on mobile manipulation was an IROS 2022 Best Paper Finalist.

