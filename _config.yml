          description: |
            **About TouchTronix Robotics Inc.:** TouchTronix Robotics Inc. is building end-to-end tactile data infrastructure for embodied AI, from thin-film tactile sensors (SensX) and tactile modules for robot grippers (TactX) to the FusionX multimodal data collection kit with its software and hardware. It also offers large-scale vision-tactile data collection as a service for robotics teams that need multimodal training data.
