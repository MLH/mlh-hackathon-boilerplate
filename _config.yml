      - image: "/images/image2.png"
        title: "Build"
        description: "Prototype with supplied and participant-owned hardware. Final inventory and equipment policies will be confirmed closer to the event."
      - image: "/images/image3.png"
        title: "Demo"
        description: "Present projects to peers, mentors, and judges. Tracks, prizes, judging criteria, and sponsor challenges are to be announced."

