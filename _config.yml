  faq:
    - question: "Is MakeCU free to attend?"
      answer: "Yes. Food, swag, hardware, and prizes will be provided."
    - question: "Where is the event?"
      answer: "MakeCU 2026 will be held in Carleton Commons at Columbia University in New York City."
    - question: "Who can attend?"
      answer: "MakeCU is intended for college hackers, from undergraduate to PhD students."
    - question: "Do I need hardware experience?"
      answer: "No. Beginners are welcome, with workshops and mentors available to help participants learn during the event."
    - question: "How large can teams be?"
      answer: "Teams of 1-4 students."
    - question: "Will hardware be provided?"
      answer: "Hardware, tools, and makerspace access will be provided."
    - question: "When can teams start building?"
      answer: "Hackers can begin after the opening ceremony."
